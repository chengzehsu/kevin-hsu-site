<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">寧可棄權，也不硬判</title>
<desc id="desc">三條誠實規則：對不上原文就不計分（觀點要和逐字稿比對，對不上的不計分）；沒選邊就不算輸贏（中立討論只存成證據）；樣本不足顯示「資料不足」，不顯示 0%。另一張資料圖：量測 90 筆實際觀點，86% 的強度分數擠在 0.6 到 0.9，沒有鑑別力，因此判斷單位改成「一集 × 一檔」並附證據鏈（2026-07-22）。直方圖為示意。</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1000" fill="#F5F7FB"/>
<rect width="1600" height="1000" fill="url(#grid)" opacity=".48"/>
<text x="96" y="92" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2.8">產品決策 / 計分的誠實規則</text>
<text x="96" y="166" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="56" font-weight="700" text-anchor="start">寧可棄權，也不硬判</text>
<text x="96" y="214" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="400" text-anchor="start">先確保每一個分數都有根據，再談準不準。</text>
<g filter="url(#shadow)"><rect x="96" y="254" width="448" height="286" rx="22" fill="#FFFFFF"/></g>
<circle cx="148" cy="306" r="22" fill="#2D61A6"/>
<text x="148" y="313" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">01</text>
<text x="186" y="315" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" text-anchor="start">對不上原文就不計分</text>
<text x="128" y="359" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">每筆觀點都拿逐字稿比對原話，</text>
<text x="128" y="389" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">對不上的不進帳、不計分。</text>
<rect x="128" y="482" width="112" height="32" rx="16" fill="#DCE8F7"/>
<text x="184.0" y="504" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">逐字稿比對</text>
<g filter="url(#shadow)"><rect x="576" y="254" width="448" height="286" rx="22" fill="#FFFFFF"/></g>
<circle cx="628" cy="306" r="22" fill="#DCE8F7"/>
<text x="628" y="313" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">02</text>
<text x="666" y="315" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" text-anchor="start">沒選邊就不算輸贏</text>
<text x="608" y="359" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">中立的討論只存成證據，</text>
<text x="608" y="389" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">不進入準確度計算。</text>
<rect x="608" y="482" width="96" height="32" rx="16" fill="#DCE8F7"/>
<text x="656.0" y="504" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">僅作證據</text>
<g filter="url(#shadow)"><rect x="1056" y="254" width="448" height="286" rx="22" fill="#FFFFFF"/></g>
<circle cx="1108" cy="306" r="22" fill="#DCE8F7"/>
<text x="1108" y="313" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">03</text>
<text x="1146" y="315" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" text-anchor="start">樣本不足顯示「資料不足」，</text>
<text x="1146" y="349" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" text-anchor="start">不顯示 0%</text>
<text x="1088" y="393" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">觀點太少時不給分數，</text>
<text x="1088" y="423" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">避免把沒資料讀成看錯。</text>
<rect x="1088" y="482" width="96" height="32" rx="16" fill="#DCE8F7"/>
<text x="1136.0" y="504" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">資料不足</text>
<g filter="url(#shadow)"><rect x="96" y="572" width="1408" height="336" rx="26" fill="#FFFFFF"/></g>
<text x="136" y="622" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="1.8">量測 90 筆實際觀點（2026-07-22）</text>
<rect x="140.0" y="836" width="52.0" height="2" rx="4" fill="#DCE8F7"/>
<rect x="200.0" y="833" width="52.0" height="5" rx="4" fill="#DCE8F7"/>
<rect x="260.0" y="833" width="52.0" height="5" rx="4" fill="#DCE8F7"/>
<rect x="320.0" y="829" width="52.0" height="9" rx="4" fill="#DCE8F7"/>
<rect x="380.0" y="824" width="52.0" height="14" rx="4" fill="#DCE8F7"/>
<rect x="440.0" y="815" width="52.0" height="23" rx="4" fill="#DCE8F7"/>
<rect x="500.0" y="726" width="52.0" height="112" rx="4" fill="#2D61A6"/>
<rect x="560.0" y="698" width="52.0" height="140" rx="4" fill="#2D61A6"/>
<rect x="620.0" y="731" width="52.0" height="107" rx="4" fill="#2D61A6"/>
<rect x="680.0" y="833" width="52.0" height="5" rx="4" fill="#DCE8F7"/>
<path d="M136 838H736" stroke="#A9B4C4" stroke-width="2"/>
<text x="136" y="866" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="middle">0</text>
<text x="736" y="866" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="middle">1</text>
<text x="436.0" y="866" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="middle">強度分數</text>
<path d="M500.0 692V682H672.0V692" fill="none" stroke="#172234" stroke-width="2"/>
<text x="586.0" y="672" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">86%</text>
<text x="800" y="684" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="64" font-weight="700" text-anchor="start">86%</text>
<text x="950" y="664" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="700" text-anchor="start">的強度分數擠在 0.6 到 0.9，</text>
<text x="950" y="698" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="700" text-anchor="start">沒有鑑別力。</text>
<path d="M800 742H1464" stroke="#DCE4EF" stroke-width="2"/>
<text x="800" y="784" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.6">所以改了判斷單位</text>
<rect x="800" y="804" width="664" height="96" rx="16" fill="#E8EEF7"/>
<text x="824" y="844" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" text-anchor="start">→</text>
<text x="860" y="844" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" text-anchor="start">判斷單位改成「一集 × 一檔」，</text>
<text x="860" y="878" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" text-anchor="start">並附上證據鏈。</text>
<text x="1504" y="948" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="end">Kevin Hsu</text>
</svg>
