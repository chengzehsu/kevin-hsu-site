<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc">
<title id="title">Stock Gods Fight: see every bull and bear case before you buy</title>
<desc id="desc">Stock Gods Fight puts every podcast host's view on one demo ticker side by side: three shows on the bull side, one on the bear side, each with a verbatim quote and its source (episode, timestamp). There is no 3 to 1 majority vote, because three bulls and one bear is not 3 to 1; one person saw a risk the others missed. Key call: lay out the arguments, never a buy or sell call. Tickers, shows, and quotes are demo data.</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="674" fill="#F5F7FB"/>
<rect width="1200" height="674" fill="url(#grid)" opacity=".48"/>
<text x="96" y="66" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2.4">AFTER HOURS / A PERSONAL PAIN</text>
<text x="96" y="122" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="38" font-weight="700" text-anchor="start">Before you buy, watch the stock gods fight.</text>
<text x="96" y="160" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">Stock Gods Fight puts every host's bull or bear case for one ticker side by side.</text>
