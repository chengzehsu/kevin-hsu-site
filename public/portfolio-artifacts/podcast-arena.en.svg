<text x="869" y="213.75" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="end">Not used</text>
<rect x="883" y="194" width="197" height="29" rx="14.5" fill="#EEF1F6"/>
<text x="981.5" y="213.75" fill="#9AA6B7" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Majority vote 3 : 1</text>
