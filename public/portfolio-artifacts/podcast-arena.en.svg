<text x="632" y="352" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="600" text-anchor="start">“The main customer still holds a lot of stock”</text>
<rect x="612" y="380" width="492" height="170" rx="16" fill="#DCE8F7"/>
<rect x="612" y="380" width="6" height="170" rx="3" fill="#2D61A6"/>
<text x="644" y="456" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" text-anchor="start">Three bulls and one bear is not 3 to 1.</text>
<text x="644" y="486" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" text-anchor="start">One person saw a risk the others missed.</text>
