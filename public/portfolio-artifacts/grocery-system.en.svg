<text x="630" y="386" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" text-anchor="start">Project overview</text>
<text x="630" y="414" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">Timeline, release scope, and test plan on one page</text>
<g filter="url(#shadow)"><rect x="540" y="452" width="564" height="88" rx="18" fill="#FFFFFF"/></g>
<circle cx="586" cy="496" r="22" fill="#DCE8F7"/>
<text x="586" y="503" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">03</text>
<text x="630" y="490" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" text-anchor="start">Project details</text>
<text x="630" y="518" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">Hours, access, and past decisions, findable any time</text>
<rect x="540" y="560" width="564" height="40" rx="12" fill="#E8EEF7"/>
<text x="562" y="586" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start">Programme result</text>
<text x="1082" y="587" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="end">Picking 300 → 1,000 orders/day (+233%)</text>
<text x="1104" y="638" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" text-anchor="end">Kevin Hsu / Product Manager</text>
