<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc">
<title id="title">蔬果電商的專案資訊系統</title>
<desc id="desc">客戶、工程與設計團隊、同事每週重複詢問進度、上版內容、時數與過往做法；把這些資訊整理成資訊流盤點、專案總覽與專案詳細資訊三個模組。專案期間揀貨日產能由 300 提升到 1,000 單／日 (+233%)。</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="674" fill="#F5F7FB"/>
<rect width="1200" height="674" fill="url(#grid)" opacity=".48"/>
<text x="96" y="66" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2.4">PROJECT OPERATIONS / 蔬果電商</text>
<text x="96" y="122" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="44" font-weight="700" text-anchor="start">資訊透明，溝通成本才會下降</text>
<text x="96" y="160" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">客戶、團隊與同事每週重複問的問題，收進同一套專案系統。</text>
<g filter="url(#shadow)"><rect x="96" y="196" width="380" height="404" rx="26" fill="#152236"/></g>
<text x="128" y="240" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="2">每週重複被問</text>
<text x="128" y="288" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">客戶</text>
<text x="128" y="318" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">下次進度是什麼？</text>
<text x="128" y="346" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">這次上版有什麼？</text>
<text x="128" y="400" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">工程／設計團隊</text>
<text x="128" y="430" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">時數可以請款了嗎？</text>
<text x="128" y="458" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">下個 Sprint 先做什麼？</text>
<text x="128" y="512" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">同事</text>
<text x="128" y="542" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">上次這個功能怎麼做的？</text>
<text x="128" y="570" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">那個專案的權限能開給我嗎？</text>
<path d="M490 398h28m-10-9 10 9-10 9" fill="none" stroke="#2D61A6" stroke-width="2.5"/>
<text x="540" y="222" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">同一套專案系統</text>
<g filter="url(#shadow)"><rect x="540" y="244" width="564" height="88" rx="18" fill="#FFFFFF"/></g>
<circle cx="586" cy="288" r="22" fill="#2D61A6"/>
<text x="586" y="295" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">01</text>
<text x="630" y="282" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" text-anchor="start">資訊流盤點</text>
<text x="630" y="310" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">訂單到交付的資料怎麼流，一張圖看完</text>
<g filter="url(#shadow)"><rect x="540" y="348" width="564" height="88" rx="18" fill="#FFFFFF"/></g>
<circle cx="586" cy="392" r="22" fill="#DCE8F7"/>
<text x="586" y="399" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">02</text>
<text x="630" y="386" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" text-anchor="start">專案總覽</text>
<text x="630" y="414" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">進度、上版內容、測試範圍，一頁對齊</text>
<g filter="url(#shadow)"><rect x="540" y="452" width="564" height="88" rx="18" fill="#FFFFFF"/></g>
<circle cx="586" cy="496" r="22" fill="#DCE8F7"/>
<text x="586" y="503" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">03</text>
<text x="630" y="490" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" text-anchor="start">專案詳細資訊</text>
<text x="630" y="518" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">時數、權限、過往做法，隨時查得到</text>
<rect x="540" y="560" width="564" height="40" rx="12" fill="#E8EEF7"/>
<text x="562" y="586" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start">專案成果</text>
<text x="1082" y="587" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="end">揀貨日產能 300 → 1,000 單／日 (+233%)</text>
<text x="1104" y="638" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" text-anchor="end">Kevin Hsu</text>
</svg>
