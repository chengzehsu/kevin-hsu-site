<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Ecofirst operating system: sales to RD on one data chain</title>
<desc id="desc">The Notion operating system built at Ecofirst. Sales lane: stakeholders (business cards) link to clients, then to the project master; sales updates move through 8 stages (BD, visit, site survey, proposal, quote, negotiation, draft contract, signed) and each one links to the project master. After the presales gate (effort tiers S / M / L / XL; the delivery clock starts at T=0 once data is complete and the requirements doc is signed), work enters the RD lane: software projects link to a requirement pool (RDD → scheduling → development → RD testing → PM / sales sign-off), where the PM's target date is compared with RD's estimate to flag rush insertions automatically. Database counts: 1,639 sales updates, 1,829 RD tasks, and 59 delivery projects linked to software projects (company Notion, Oct 2026); no client names or amounts.</desc>
