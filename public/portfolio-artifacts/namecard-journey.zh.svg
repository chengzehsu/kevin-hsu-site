<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc">
<title id="title">AI 名片管理助手：從原型到依實際用量瘦身</title>
<desc id="desc">工作之餘做的名片工具：在 LINE 拍名片，Gemini 辨識後寫進公司的 Notion 聯絡人資料庫。2025/7 個人原型；2025/8 至 2025/9 對齊公司 CRM 欄位，判斷欄位留給業務自己填，AI 推測只寫進備註；2025/12 至 2026/2 嘗試多租戶 SaaS 與訂閱方案；2026/7 自己發起架構盤點，確認實際用量很小，只有公司業務與幾位朋友，於是移除 Redis、RQ、SocketIO。</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="674" fill="#F5F7FB"/>
<rect width="1200" height="674" fill="url(#grid)" opacity=".48"/>
<text x="96" y="66" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2.4">工作之餘 / 公司的困擾</text>
<text x="96" y="122" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="42" font-weight="700" text-anchor="start">先做出來，再對齊業務，最後依實際用量瘦身</text>
<text x="96" y="160" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">在 LINE 拍名片，AI 辨識後直接寫進公司的 Notion 聯絡人資料庫。</text>
<path d="M216 234H984" stroke="#DCE8F7" stroke-width="2"/>
<g filter="url(#shadow)"><rect x="96" y="200" width="240" height="318" rx="20" fill="#FFFFFF"/></g>
<circle cx="130" cy="234" r="16" fill="#DCE8F7"/>
<text x="130" y="239" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text>
<text x="156" y="239" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">2025/7</text>
<text x="118" y="288" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="start">個人原型</text>
<text x="118" y="329" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">拍名片傳進 LINE，</text>
<text x="118" y="356" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">Gemini 辨識後寫進 Notion</text>
<text x="118" y="383" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">Telegram 與 LINE 來回，</text>
<text x="118" y="410" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">最後選定 LINE</text>
<g filter="url(#shadow)"><rect x="352" y="200" width="240" height="318" rx="20" fill="#FFFFFF"/></g>
<circle cx="386" cy="234" r="16" fill="#DCE8F7"/>
<text x="386" y="239" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text>
<text x="412" y="239" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">2025/8 至 2025/9</text>
<text x="374" y="288" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="start">對齊公司 CRM 欄位</text>
<text x="374" y="329" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">照公司資料庫的欄位對應</text>
<text x="374" y="356" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">決策影響力、負責業務、</text>
<text x="374" y="383" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">窗口的困擾或 KPI</text>
<text x="374" y="410" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">判斷欄位留給業務自己填，</text>
<text x="374" y="437" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">AI 推測只寫進備註</text>
<g filter="url(#shadow)"><rect x="608" y="200" width="240" height="318" rx="20" fill="#FFFFFF"/></g>
<circle cx="642" cy="234" r="16" fill="#DCE8F7"/>
<text x="642" y="239" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text>
<text x="668" y="239" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">2025/12 至 2026/2</text>
<text x="630" y="288" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="start">嘗試多租戶 SaaS，</text>
<text x="630" y="315" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="start">加上訂閱方案</text>
<text x="630" y="356" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">Free、Starter、</text>
<text x="630" y="383" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">Business、Enterprise</text>
<text x="630" y="410" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">每個方案各有額度，</text>
<text x="630" y="437" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">後台管理租戶與方案</text>
<g filter="url(#shadow)"><rect x="864" y="200" width="240" height="318" rx="20" fill="#152236"/></g>
<circle cx="898" cy="234" r="16" fill="#2D61A6"/>
<text x="898" y="239" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text>
<text x="924" y="239" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">2026/7</text>
<text x="886" y="288" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="start">依實際用量瘦身</text>
<text x="886" y="329" fill="#C9D6EA" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">自己發起架構盤點：</text>
<text x="886" y="356" fill="#C9D6EA" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">實際用量很小，</text>
<text x="886" y="383" fill="#C9D6EA" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">公司業務與幾位朋友</text>
<text x="886" y="410" fill="#C9D6EA" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="400" text-anchor="start">移除 Redis、RQ、SocketIO</text>
<rect x="96" y="540" width="1008" height="60" rx="14" fill="#E8EEF7"/>
<text x="124" y="576" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">關鍵判斷</text>
<text x="1076" y="578" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" text-anchor="end">用量很小，就不該背著分散式架構</text>
<text x="1104" y="638" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" text-anchor="end">Kevin Hsu</text>
</svg>
