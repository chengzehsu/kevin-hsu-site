<text x="880" y="582" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">One SQLite database: tenants, quotas, retries</text>
<circle cx="856" cy="615" r="12" fill="#DCE8F7"/>
