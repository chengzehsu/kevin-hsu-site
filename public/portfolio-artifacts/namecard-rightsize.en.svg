<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Business-card assistant infra audit: before and after</title>
<desc id="desc">The July 2026 audit found real usage was small: the company's sales team and a few friends. Redis, RQ, and SocketIO, built for a distributed multi-tenant service, were removed; the LINE to Gemini to Notion flow, one SQLite database, encrypted credentials, and the Gemini backup key stayed, and the quota check now actually blocks overuse. The sample card is a made-up person.</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1000" fill="#F5F7FB"/>
<rect width="1600" height="1000" fill="url(#grid)" opacity=".48"/>
<text x="120" y="92" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2.6">INFRA AUDIT / JULY 2026</text>
<text x="120" y="160" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="46" font-weight="700" text-anchor="start">Measure the real scale, then decide what stays</text>
<text x="120" y="208" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" text-anchor="start">Audit finding: real usage was small, the company's sales team and a few friends.</text>
<g filter="url(#shadow)"><rect x="120" y="252" width="600" height="500" rx="28" fill="#152236"/></g>
<text x="160" y="314" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" text-anchor="start">Before the audit</text>
<text x="160" y="350" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">Built for a distributed multi-tenant service</text>
<text x="160" y="434" fill="#8DA0BC" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="30" font-weight="700" text-anchor="start">Redis</text>
<path d="M156 424H242" stroke="#8FB8EF" stroke-width="3"/>
<text x="160" y="472" fill="#E4ECF8" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="400" text-anchor="start">Quota and batch state moved to SQLite</text>
<text x="160" y="546" fill="#8DA0BC" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="30" font-weight="700" text-anchor="start">RQ queue and worker</text>
<path d="M156 536H460" stroke="#8FB8EF" stroke-width="3"/>
<text x="160" y="584" fill="#E4ECF8" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="400" text-anchor="start">Uploads run on one background thread</text>
<text x="160" y="658" fill="#8DA0BC" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="30" font-weight="700" text-anchor="start">SocketIO live push</text>
<path d="M156 648H445" stroke="#8FB8EF" stroke-width="3"/>
<text x="160" y="696" fill="#E4ECF8" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="400" text-anchor="start">Progress now polls; same feature</text>
<path d="M738 502h48m-14-13 14 13-14 13" fill="none" stroke="#2D61A6" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="804" y="252" width="676" height="500" rx="28" fill="#FFFFFF"/></g>
<text x="844" y="314" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" text-anchor="start">After the audit</text>
<text x="844" y="350" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">Main flow untouched; only what is used stays</text>
<rect x="844" y="380" width="250" height="146" rx="10" fill="#FBFCFE" stroke="#C9D6EA" stroke-width="1.5" transform="rotate(-3 969.0 453.0)"/>
