<rect x="1156" y="380" width="284" height="150" rx="12" fill="#F3F6FB" stroke="#DCE8F7" stroke-width="1.5"/>
<text x="1174" y="408" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start">Notion 聯絡人</text>
<text x="1174" y="436" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">姓名</text>
<text x="1292" y="436" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">王小明</text>
<text x="1174" y="462" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">公司</text>
<text x="1292" y="462" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">範例科技</text>
<text x="1174" y="488" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">職稱</text>
<text x="1292" y="488" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">業務經理</text>
<text x="1174" y="514" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="400" text-anchor="start">決策影響力</text>
<text x="1292" y="514" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">由業務自填</text>
<circle cx="856" cy="575" r="12" fill="#DCE8F7"/>
<path d="M850 575l4 4 8-8" fill="none" stroke="#2D61A6" stroke-width="2.4"/>
<text x="880" y="582" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">SQLite 單一資料庫：租戶、配額、補傳紀錄</text>
<circle cx="856" cy="615" r="12" fill="#DCE8F7"/>
<path d="M850 615l4 4 8-8" fill="none" stroke="#2D61A6" stroke-width="2.4"/>
<text x="880" y="622" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">LINE 與 Notion 憑證維持加密</text>
<circle cx="856" cy="655" r="12" fill="#DCE8F7"/>
<path d="M850 655l4 4 8-8" fill="none" stroke="#2D61A6" stroke-width="2.4"/>
<text x="880" y="662" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">Gemini 主備金鑰自動切換</text>
<circle cx="856" cy="695" r="12" fill="#DCE8F7"/>
