<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc">
<title id="title">股神打架：買之前，先看各方多空</title>
<desc id="desc">股神打架把同一檔示範標的的 Podcast 看法並排：多方三個節目、空方一個節目，每一位都附上原話與出處（集數、時間點）。不做多數決 3:1，因為三家看多、一家看空，不是 3:1，而是有一個人看到了別人沒看到的風險。關鍵判斷：只攤開論點，不給買賣建議。圖中標的、節目與原話皆為示範資料。</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="674" fill="#F5F7FB"/>
<rect width="1200" height="674" fill="url(#grid)" opacity=".48"/>
<text x="96" y="66" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2.4">工作之餘 / 自己的困擾</text>
<text x="96" y="122" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="44" font-weight="700" text-anchor="start">買之前，先看股神打架。</text>
<text x="96" y="160" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">股神打架：同一檔標的，每位主持人的多空看法與原話並排。</text>
<rect x="96" y="184" width="1008" height="50" rx="14" fill="#FFFFFF" stroke="#DCE4EF"/>
<text x="120" y="216" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" text-anchor="start">範例標的 A</text>
<text x="937" y="213.75" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="end">不採用</text>
<rect x="951" y="194" width="129" height="29" rx="14.5" fill="#EEF1F6"/>
<text x="1015.5" y="213.75" fill="#9AA6B7" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">多數決 3 : 1</text>
<path d="M961 208.5H1070" stroke="#7C899B" stroke-width="2"/>
<rect x="96" y="250" width="492" height="4" rx="2" fill="#2D61A6"/>
<rect x="612" y="250" width="492" height="4" rx="2" fill="#172234"/>
<text x="96" y="276" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.4">多方｜3 個聲音</text>
<text x="612" y="276" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.4">空方｜1 個聲音</text>
<g filter="url(#shadow)"><rect x="96" y="290" width="492" height="80" rx="16" fill="#FFFFFF"/></g>
<text x="116" y="320" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">節目甲</text>
<rect x="411" y="303" width="161" height="24" rx="12" fill="#EEF2F8"/>
<text x="491.5" y="320" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="12" font-weight="400" text-anchor="middle">出自：第 12 集 · 18:42</text>
<text x="116" y="352" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">「這季訂單能見度比上季好」</text>
<g filter="url(#shadow)"><rect x="96" y="380" width="492" height="80" rx="16" fill="#FFFFFF"/></g>
<text x="116" y="410" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">節目乙</text>
<rect x="417" y="393" width="155" height="24" rx="12" fill="#EEF2F8"/>
<text x="494.5" y="410" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="12" font-weight="400" text-anchor="middle">出自：第 7 集 · 21:05</text>
<text x="116" y="442" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">「新產品線的需求看起來穩定」</text>
<g filter="url(#shadow)"><rect x="96" y="470" width="492" height="80" rx="16" fill="#FFFFFF"/></g>
<text x="116" y="500" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">節目丙</text>
<rect x="417" y="483" width="155" height="24" rx="12" fill="#EEF2F8"/>
<text x="494.5" y="500" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="12" font-weight="400" text-anchor="middle">出自：第 3 集 · 40:17</text>
<text x="116" y="532" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">「通路回報的反應不錯」</text>
<g filter="url(#shadow)"><rect x="612" y="290" width="492" height="80" rx="16" fill="#152236"/></g>
<text x="632" y="320" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">節目丁</text>
<rect x="933" y="303" width="155" height="24" rx="12" fill="#24344D"/>
<text x="1010.5" y="320" fill="#BFD3F0" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="12" font-weight="400" text-anchor="middle">出自：第 9 集 · 12:30</text>
<text x="632" y="352" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">「主要客戶的庫存其實還很高」</text>
<rect x="612" y="380" width="492" height="170" rx="16" fill="#DCE8F7"/>
<rect x="612" y="380" width="6" height="170" rx="3" fill="#2D61A6"/>
<text x="644" y="456" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" text-anchor="start">三家看多、一家看空，不是 3:1，</text>
<text x="644" y="489" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" text-anchor="start">而是有一個人看到了別人沒看到的風險。</text>
<rect x="96" y="566" width="1008" height="40" rx="12" fill="#E8EEF7"/>
<text x="118" y="592" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start">關鍵判斷</text>
<text x="1082" y="593" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="end">只攤開論點，不給買賣建議</text>
<text x="1104" y="642" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" text-anchor="end">Kevin Hsu</text>
</svg>
