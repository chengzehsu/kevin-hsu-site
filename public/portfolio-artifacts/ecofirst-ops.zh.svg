<text x="1228" y="326" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">04</text>
<text x="1258" y="328" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" text-anchor="start">業務推進</text>
<text x="1216" y="366" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start">8 個階段，每筆連到專案總表</text>
