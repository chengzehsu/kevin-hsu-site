<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">每句話都有出處，看法變了也查得到</title>
<desc id="desc">以前一集只有一份摘要，回答不了誰的看法什麼時候變了。股神打架把每一句看法記成標的、立場、時間、原話與出處：同一個節目對示範標的 A 先看多、再沒選邊、後來看空，每一步都留著原話與集數、時間點。關鍵判斷：每筆觀點都要找得到原話。圖中標的、節目與原話皆為示範資料。</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1600" height="1000" fill="#F5F7FB"/>
<rect width="1600" height="1000" fill="url(#grid)" opacity=".48"/>
<text x="96" y="92" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2.8">產品決策 / 觀點有出處</text>
<text x="96" y="166" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="54" font-weight="700" text-anchor="start">每句話都有出處，看法變了也查得到</text>
<text x="96" y="214" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="400" text-anchor="start">同一位主持人對同一檔標的的看法隨時間改變，每一步都留著原話。</text>
<rect x="96" y="262" width="440" height="630" rx="26" fill="#EBEFF5" stroke="#D3DBE7"/>
<text x="132" y="312" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.8">以前：一集一份摘要</text>
<rect x="124" y="342" width="384" height="230" rx="18" fill="#FFFFFF" opacity=".75"/>
<text x="152" y="392" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="700" text-anchor="start">本集摘要</text>
<circle cx="158" cy="441" r="4" fill="#A9B4C4"/>
<text x="176" y="448" fill="#8592A5" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">主持人聊了本季產業景氣</text>
<circle cx="158" cy="481" r="4" fill="#A9B4C4"/>
<text x="176" y="488" fill="#8592A5" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">提到幾檔關注中的標的</text>
<circle cx="158" cy="521" r="4" fill="#A9B4C4"/>
<text x="176" y="528" fill="#8592A5" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">最後談到總體經濟</text>
<rect x="124" y="602" width="384" height="262" rx="18" fill="none" stroke="#B8C3D3" stroke-dasharray="7 7"/>
<text x="152" y="658" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.6">這份摘要回答不了</text>
<text x="152" y="714" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="700" text-anchor="start">誰的看法什麼時候變了？</text>
<text x="152" y="758" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="700" text-anchor="start">講得準不準？</text>
<path d="M560 577h32m-12-11 12 11-12 11" fill="none" stroke="#2D61A6" stroke-width="3"/>
<text x="616" y="288" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1.8">股神打架：節目甲 × 範例標的 A</text>
<path d="M630 392.0V736.0" stroke="#C5D2E4" stroke-width="3"/>
<circle cx="630" cy="392.0" r="10" fill="#2D61A6" stroke="#FFFFFF" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="660" y="316" width="844" height="152" rx="20" fill="#FFFFFF"/></g>
<rect x="688" y="340" width="112" height="36" rx="18" fill="#2D61A6"/>
<text x="744" y="364" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">看多</text>
<text x="1476" y="365" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="end">2026-03-04</text>
<text x="688" y="416" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="28" font-weight="600" text-anchor="start">「這季訂單能見度比上季好」</text>
<text x="688" y="448" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">出自：節目甲 · 第 12 集 · 18:42</text>
<circle cx="630" cy="564.0" r="10" fill="#DCE8F7" stroke="#FFFFFF" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="660" y="488" width="844" height="152" rx="20" fill="#FFFFFF"/></g>
<rect x="688" y="512" width="112" height="36" rx="18" fill="#DCE8F7"/>
<text x="744" y="536" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">沒選邊</text>
<text x="1476" y="537" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="end">2026-04-15</text>
<text x="688" y="588" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="28" font-weight="600" text-anchor="start">「先觀察下一季庫存再說」</text>
<text x="688" y="620" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">出自：節目甲 · 第 14 集 · 33:10</text>
<circle cx="630" cy="736.0" r="10" fill="#172234" stroke="#FFFFFF" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="660" y="660" width="844" height="152" rx="20" fill="#FFFFFF"/></g>
<rect x="688" y="684" width="112" height="36" rx="18" fill="#172234"/>
<text x="744" y="708" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">看空</text>
<text x="1476" y="709" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="end">2026-05-20</text>
<text x="688" y="760" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="28" font-weight="600" text-anchor="start">「客戶拉貨的節奏在放慢」</text>
<text x="688" y="792" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="start">出自：節目甲 · 第 15 集 · 09:26</text>
<rect x="660" y="836" width="844" height="56" rx="14" fill="#E8EEF7"/>
<text x="688" y="871" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" text-anchor="start">關鍵判斷</text>
<text x="1476" y="872" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" text-anchor="end">每筆觀點都要找得到原話</text>
<text x="1504" y="948" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" text-anchor="end">Kevin Hsu</text>
</svg>
