<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc">
<title id="title">健康 App 的情境規格化</title>
<desc id="desc">訪談重要角色，還原 IoT 體重計、活動報名、多國語系與舊資料遷移的真實情境，再整理成 Wireframe、User Story、PRD、參數對照表與翻譯對照表。新平台上線一年後，DAU 由 12,000 增至 20,000 (+66%)。</desc>
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE4EF" stroke-width="1"/></pattern>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#132033" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="674" fill="#F5F7FB"/>
<rect width="1200" height="674" fill="url(#grid)" opacity=".48"/>
<text x="96" y="66" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2.4">PRODUCT SPEC / 健康 App</text>
<text x="96" y="122" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="44" font-weight="700" text-anchor="start">先還原真實情境，再寫成規格</text>
<text x="96" y="160" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" text-anchor="start">訪談重要角色，把跨裝置情境轉成工程能直接開工的文件。</text>
<g filter="url(#shadow)"><rect x="96" y="196" width="380" height="404" rx="26" fill="#152236"/></g>
<text x="128" y="240" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="2">訪談還原的情境</text>
<text x="128" y="288" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">IoT 體重計</text>
<text x="128" y="318" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">量測資料要接進新平台</text>
<text x="128" y="346" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">裝置與 App 的欄位對不上</text>
<text x="128" y="400" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">活動報名</text>
<text x="128" y="430" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">報名流程要搬進新 App</text>
<text x="128" y="458" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">每種裝置的操作要一致</text>
<text x="128" y="512" fill="#8FB8EF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start">多國語系與舊資料</text>
<text x="128" y="542" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="600" text-anchor="start">舊欄位要遷移到新結構</text>
<text x="128" y="570" fill="#F7FAFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" text-anchor="start">每種語系的文案要對齊</text>
<path d="M490 398h28m-10-9 10 9-10 9" fill="none" stroke="#2D61A6" stroke-width="2.5"/>
<text x="540" y="222" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">真實情境規格化</text>
<g filter="url(#shadow)"><rect x="540" y="238" width="180" height="112" rx="16" fill="#FFFFFF"/></g>
<circle cx="570" cy="268" r="15" fill="#2D61A6"/>
<text x="570" y="273" fill="#FFFFFF" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text>
<text x="594" y="274" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start">Wireframe</text>
<text x="558" y="330" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="400" text-anchor="start">畫面與跨裝置流程</text>
<g filter="url(#shadow)"><rect x="732" y="238" width="180" height="112" rx="16" fill="#FFFFFF"/></g>
<circle cx="762" cy="268" r="15" fill="#DCE8F7"/>
<text x="762" y="273" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text>
<text x="786" y="274" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start">User Story</text>
<text x="750" y="330" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="400" text-anchor="start">每個角色要完成的事</text>
<g filter="url(#shadow)"><rect x="924" y="238" width="180" height="112" rx="16" fill="#FFFFFF"/></g>
<circle cx="954" cy="268" r="15" fill="#DCE8F7"/>
<text x="954" y="273" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text>
<text x="978" y="274" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start">PRD</text>
<text x="942" y="330" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="400" text-anchor="start">功能範圍與驗收</text>
<text x="540" y="386" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">開發前先對齊</text>
<g filter="url(#shadow)"><rect x="540" y="402" width="276" height="112" rx="16" fill="#FFFFFF"/></g>
<circle cx="570" cy="432" r="15" fill="#DCE8F7"/>
<text x="570" y="437" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text>
<text x="594" y="438" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start">參數對照表</text>
<text x="558" y="494" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="400" text-anchor="start">新舊欄位、IoT 資料逐欄對照</text>
<g filter="url(#shadow)"><rect x="828" y="402" width="276" height="112" rx="16" fill="#FFFFFF"/></g>
<circle cx="858" cy="432" r="15" fill="#DCE8F7"/>
<text x="858" y="437" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">05</text>
<text x="882" y="438" fill="#172234" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="start">翻譯對照表</text>
<text x="846" y="494" fill="#5A6980" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="400" text-anchor="start">多國語系文案上線前對齊</text>
<rect x="540" y="560" width="564" height="40" rx="12" fill="#E8EEF7"/>
<text x="562" y="586" fill="#52627A" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="start">專案成果</text>
<text x="1082" y="587" fill="#2D61A6" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" text-anchor="end">上線 1 年 DAU 12,000 → 20,000 (+66%)</text>
<text x="1104" y="638" fill="#7C899B" font-family="Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" text-anchor="end">Kevin Hsu / Product Manager</text>
</svg>
